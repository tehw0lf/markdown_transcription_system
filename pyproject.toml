[project]
name = "markdown-transcription-system"
version = "1.0.4"
description = "Universal Markdown Audio Transcription System - privacy-first local transcription tool"
authors = [{name = "tehwolf"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0",
    "ffmpeg-python>=0.2.0",
    "openai-whisper>=20250625",
]

[project.scripts]
markdown-transcription = "src.transcription_system:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = [
    # The broad `except Exception` handlers are deliberate: transcription can
    # represent minutes of GPU time, so failures are logged and the run
    # continues rather than aborting the batch.
    "BLE001",
]
