[project]
name = "markdown-transcription-system"
version = "1.0.3"
description = "Universal Markdown Audio Transcription System - privacy-first local transcription tool"
authors = [{name = "tehwolf"}]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyYAML>=6.0",
    "ffmpeg-python>=0.2.0",
    "openai-whisper>=20250625",
]

[project.scripts]
markdown-transcription = "src.transcription_system:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pyflakes (F), pycodestyle errors (E) and import sorting (I).
# Deliberately not enabling the stylistic/modernisation rulesets yet: they
# flag a few dozen pre-existing issues that are worth their own pass.
select = ["E", "F", "I"]
